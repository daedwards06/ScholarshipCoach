[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarshipcoach"
version = "0.1.0"
description = "ScholarshipCoach project scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "pyarrow",
  "scikit-learn",
  "sentence-transformers",
  "streamlit",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pytest-cov",
  "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "scripts*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --cov=src --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/scholarshipcoach.egg-info/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
