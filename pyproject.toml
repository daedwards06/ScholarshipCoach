[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarshipcoach"
version = "0.1.0"
description = "ScholarshipCoach project scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "pyarrow",
  "scikit-learn",
  "sentence-transformers",
  "streamlit",
  "requests",
  "jsonschema",
]

[project.optional-dependencies]
# Pinned exactly. CI installs these fresh on every run, so an unpinned tool
# lets a new upstream release change the build with no code change -- which is
# what silently broke lint between 2026-07-16 and 2026-08-07 (ruff 0.16
# expanded its default rule set). Bump these deliberately, in their own commit.
dev = [
  "pytest==9.0.2",
  "ruff==0.16.7",
  "pytest-cov==7.1.0",
  "mypy==2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "scripts*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --cov=src --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/scholarshipcoach.egg-info/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Declared explicitly rather than inherited. Ruff's implicit default rule set
# is not stable across releases; naming the rules keeps lint reproducible.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
